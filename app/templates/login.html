{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card p-4 p-md-5 border-0 shadow-sm">
      <div class="text-center mb-4">
        <div class="brand-badge-box mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.3rem;">
          <i class="bi bi-shield-lock-fill text-white"></i>
        </div>
        <h4 class="fw-bold mb-1 text-slate-900">Sign in to SmartDesk</h4>
        <p class="text-muted small">Access your workspace or customer dashboard</p>
      </div>

      {% if error %}
        <div class="alert alert-danger py-2 small rounded-3 mb-3 border-0">
          <i class="bi bi-exclamation-circle me-1"></i> {{ error }}
        </div>
      {% endif %}

      <form method="POST" action="{{ url_for('web.login') }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-slate-700">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-envelope"></i></span>
            <input type="email" id="loginEmail" name="email" class="form-control border-start-0 ps-0" placeholder="name@company.com" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold text-slate-700">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-lock"></i></span>
            <input type="password" id="loginPassword" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold rounded-3 shadow-sm">
          Sign In
        </button>
      </form>

      <div class="mt-4 pt-3 border-top">
        <span class="small text-muted d-block text-center mb-2" style="font-size: 0.75rem;">DEMO CREDENTIALS (CLICK TO FILL):</span>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-sm btn-light border flex-fill text-start py-1.5" onclick="fillCreds('admin@smartdesk.local', 'Admin@123')">
            <div class="fw-bold small text-dark lh-1">Admin</div>
            <span class="text-muted" style="font-size: 0.7rem;">admin@smartdesk.local</span>
          </button>
        </div>
      </div>

      <div class="text-center mt-3">
        <span class="small text-muted">Don't have an account?</span>
        <a href="{{ url_for('web.register') }}" class="small fw-bold text-decoration-none ms-1 text-primary">Sign up as Customer</a>
      </div>
    </div>
  </div>
</div>

<script>
function fillCreds(email, pwd) {
  document.getElementById('loginEmail').value = email;
  document.getElementById('loginPassword').value = pwd;
}
</script>
{% endblock %}
